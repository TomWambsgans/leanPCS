[package]
name = "quotient"
version.workspace = true
edition.workspace = true
publish = false
description = "Zero-knowledge Merkle membership (Keccak-256) reduced to six PCS claims (the EIP draft's encoding)"

[lints]
workspace = true

[dependencies]
pcs_claim.workspace = true
parallel.workspace = true
primitives.workspace = true
fiat_shamir.workspace = true
pcs.workspace = true
verifier.workspace = true
tracing.workspace = true
rand.workspace = true
rand_chacha.workspace = true

[dev-dependencies]
primitives = { workspace = true, features = ["test-util"] }
bench.workspace = true
sha3.workspace = true

[[bench]]
name = "membership"
harness = false
