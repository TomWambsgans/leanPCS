# The workspace layout, lints, dependency versions and release profile follow leanVM's
# (https://github.com/leanEthereum/leanVM, commit c445e3d51a5a85031df47240595698f3b24897bf),
# MIT OR Apache-2.0. See AGENTS.md.
[workspace]
members = [
    "crates/evm_link",
    "crates/pcs_claim",
    "crates/membership/*",
    "crates/leanvm/*",
    "crates/vendor/leanvm-c445e3d5/*",
    "crates/vendor/flock-42422001",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

# Numeric kernels legitimately index by loop variable and take many arguments.
[workspace.lints.clippy]
needless_range_loop = "allow"
too_many_arguments = "allow"

[workspace.dependencies]
# leanVM c445e3d5, vendored (crates/vendor/leanvm-c445e3d5).
bench = { path = "crates/vendor/leanvm-c445e3d5/bench" }
primitives = { path = "crates/vendor/leanvm-c445e3d5/primitives" }
fiat_shamir = { path = "crates/vendor/leanvm-c445e3d5/fiat_shamir" }
pcs = { path = "crates/vendor/leanvm-c445e3d5/pcs" }
parallel = { path = "crates/vendor/leanvm-c445e3d5/parallel" }
verifier = { path = "crates/vendor/leanvm-c445e3d5/verifier" }
# leanVM 42422001's Flock prover, vendored and ported onto c445e3d5 (crates/vendor/flock-42422001).
flock = { path = "crates/vendor/flock-42422001" }
# This repository.
evm_link = { path = "crates/evm_link" }
pcs_claim = { path = "crates/pcs_claim" }
quotient = { path = "crates/membership/quotient" }
leanvm_statement = { path = "crates/leanvm/statement" }
leanvm_univariate = { path = "crates/leanvm/univariate" }
gf2_linear = { path = "crates/leanvm/gf2_linear" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
bincode = "1"
rand = "0.9"
rand_chacha = "0.9"
sha3 = "0.11"
tikv-jemallocator = "0.7"
tracing = "0.1.26"
tracing-forest = { version = "0.3.0", features = ["ansi", "smallvec"] }
tracing-subscriber = { version = "0.3.23", features = ["std", "env-filter"] }
revm = { version = "27.1.0", default-features = false, features = ["std"] }

[profile.release]
lto = "thin"
codegen-units = 1
